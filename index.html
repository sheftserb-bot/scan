<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Переводчик">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Синхронный переводчик</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#252b38;--txt:#f2f4f8;--dim:#8a93a6;--acc:#4f8cff;--rec:#ff4d5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
select{flex:1;min-width:0;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-size:16px}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px}
#swap{font-size:18px}
#log{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.item{margin-bottom:18px}
.src{color:var(--dim);font-size:16px;line-height:1.35}
.dst{font-size:24px;line-height:1.3;font-weight:600;margin-top:4px}
.live .src,.live .dst{opacity:.85}
.live .dst{color:#9fc0ff}
.hint{color:var(--dim);text-align:center;margin-top:30vh;padding:0 24px;line-height:1.5}
footer{display:flex;gap:10px;align-items:center;padding:10px 12px 14px;border-top:1px solid var(--line)}
#mic{flex:1;padding:16px;font-size:18px;font-weight:600;background:var(--acc);border:0;border-radius:14px}
#mic.on{background:var(--rec)}
#status{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);text-align:center;font-size:13px;line-height:1.35;padding:6px 12px;background:var(--bg);color:var(--rec);pointer-events:none}
</style>
</head>
<body>
<header>
  <select id="from"></select>
  <button id="swap" title="Поменять">⇄</button>
  <select id="to"></select>
  <button id="speak" title="Озвучка">🔇</button>
  <button id="clear" title="Очистить">✕</button>
</header>
<div id="status"></div>
<div id="log"><div class="hint" id="hint">Выберите языки и нажмите «Начать». Перевод появляется прямо во время речи.</div></div>
<footer><button id="mic">🎤 Начать</button></footer>

<script>
const LANGS=[
 ['lv','Latviešu','lv-LV','latvian'],['ru','Русский','ru-RU','russian'],['en','English','en-US','english'],
 ['de','Deutsch','de-DE','german'],['lt','Lietuvių','lt-LT','lithuanian'],['et','Eesti','et-EE','estonian'],
 ['pl','Polski','pl-PL','polish'],['uk','Українська','uk-UA','ukrainian'],['fr','Français','fr-FR','french'],
 ['es','Español','es-ES','spanish'],['it','Italiano','it-IT','italian'],['tr','Türkçe','tr-TR','turkish']
];
const $=id=>document.getElementById(id);
const from=$('from'),to=$('to'),log=$('log'),mic=$('mic'),status=$('status');
for(const s of [from,to]) for(const l of LANGS){const o=document.createElement('option');o.value=l[0];o.textContent=l[1];s.appendChild(o)}
from.value=localStorage.from2||'ru'; to.value=localStorage.to2||'en';
const save=()=>{localStorage.from2=from.value;localStorage.to2=to.value};
from.onchange=()=>{save();restart()}; to.onchange=save;
$('swap').onclick=()=>{[from.value,to.value]=[to.value,from.value];save();restart()};
$('clear').onclick=()=>{log.innerHTML='';liveEl=null};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
let rec=null,wanted=false,liveEl=null,timer=null,reqId=0,lastSent='',paused=false,ttsOn=localStorage.tts==='1';

// ---- перевод: Google (без ключа), запасной — MyMemory
async function translate(text,sl,tl){
  try{
    const u='https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+sl+'&tl='+tl+'&q='+encodeURIComponent(text);
    const r=await fetch(u); if(!r.ok) throw 0;
    const j=await r.json(); return j[0].map(x=>x[0]).join('');
  }catch(e){
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+sl+'|'+tl);
    const j=await r.json(); return j.responseData.translatedText;
  }
}

// ---- озвучка перевода
function pickVoice(code){
  const vs=speechSynthesis.getVoices(), pre=code.toLowerCase();
  return vs.find(v=>v.lang.toLowerCase().replace('_','-')===pre)||vs.find(v=>v.lang.toLowerCase().startsWith(pre.split('-')[0]));
}
function resumeListening(){
  if(!paused) return;
  paused=false;
  if(wanted) setTimeout(()=>{ if(wanted&&!paused) startIOS() },300);
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(text);
  const code=LANGS.find(l=>l[0]===to.value)[2];
  u.lang=code; const v=pickVoice(code); if(v) u.voice=v;
  // на время озвучки отключаем микрофон, чтобы он не слышал динамик
  if(wanted&&!paused){ paused=true; try{rec&&(rec.onend=null,rec.abort())}catch(_){} }
  u.onend=u.onerror=()=>{ if(!speechSynthesis.speaking&&!speechSynthesis.pending) resumeListening() };
  speechSynthesis.speak(u);
}
const sp=$('speak');
function uiSpeak(){sp.textContent=ttsOn?'🔊':'🔇';sp.style.opacity=ttsOn?1:.6}
sp.onclick=()=>{
  ttsOn=!ttsOn; localStorage.tts=ttsOn?'1':'0'; uiSpeak();
  if(ttsOn){ const u=new SpeechSynthesisUtterance(' '); speechSynthesis.speak(u); } // разблокировка звука в iOS
  else { speechSynthesis.cancel(); resumeListening(); }
};
uiSpeak(); speechSynthesis&&speechSynthesis.getVoices();
function makeItem(live){
  $('hint')&&$('hint').remove();
  const d=document.createElement('div');d.className='item'+(live?' live':'');
  d.innerHTML='<div class="src"></div><div class="dst"></div>';
  log.appendChild(d);return d;
}
function scroll(){log.scrollTop=log.scrollHeight}
async function update(el,text,final){
  el.querySelector('.src').textContent=text;
  const my=++reqId; el._req=my;
  try{
    const t=await translate(text,from.value,to.value);
    if(el._req===my) el.querySelector('.dst').textContent=t;
    if(final&&ttsOn) speak(t);
  }catch(e){ el.querySelector('.dst').textContent='… нет связи'; }
  scroll();
}
function schedule(text,final){
  if(!liveEl) liveEl=makeItem(true);
  const el=liveEl;
  el.querySelector('.src').textContent=text; scroll();
  clearTimeout(timer);
  if(final){ el.classList.remove('live'); liveEl=null; update(el,text,true); return; }
  timer=setTimeout(()=>{ if(text!==lastSent){lastSent=text;update(el,text)} },350);
}

// ================= Распознавание iOS (русский, английский и др.) =================
function startIOS(){
  if(!SR){status.textContent='Распознавание речи не поддерживается. Откройте в Safari.';wanted=false;ui();return}
  rec=new SR();
  rec.lang=LANGS.find(l=>l[0]===from.value)[2];
  rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i], t=r[0].transcript.trim();
      if(t) schedule(t,r.isFinal);
    }
  };
  rec.onerror=e=>{
    if(e.error==='service-not-allowed'){
      wanted=false;ui();
      status.textContent='iOS не поддерживает распознавание этого языка. Выберите другой исходный язык (например, русский или английский). [service-not-allowed]';
    }else if(e.error==='not-allowed'){
      wanted=false;ui();
      status.textContent='Сайту запрещён микрофон: значок aA в адресной строке → Настройки веб-сайта → Микрофон → Разрешить, затем обновите страницу. [not-allowed]';
    }else if(e.error!=='no-speech'&&e.error!=='aborted'){status.textContent='Ошибка: '+e.error}
  };
  rec.onend=()=>{ if(wanted&&!paused) setTimeout(()=>{try{startIOS()}catch(_){}},150); };
  try{rec.start();status.textContent=''}catch(e){}
}

function start(){ status.style.color=''; startIOS(); }
function stopEngines(){
  try{ if(rec){rec.onend=null;rec.abort()} }catch(_){}
  rec=null;
}
function stop(){wanted=false;paused=false;speechSynthesis&&speechSynthesis.cancel();stopEngines()}
function restart(){ if(wanted){stopEngines();start()} }
function ui(){mic.classList.toggle('on',wanted);mic.textContent=wanted?'⏹ Стоп':'🎤 Начать'}
mic.onclick=()=>{ if(wanted){stop()}else{wanted=true;start()} ui(); };

window.addEventListener('error',e=>{status.style.color='';status.textContent='Ошибка: '+e.message});
window.addEventListener('unhandledrejection',e=>{status.style.color='';status.textContent='Ошибка: '+(e.reason&&e.reason.message||e.reason)});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let lock=null;
async function keepAwake(){try{if(wanted&&navigator.wakeLock)lock=await navigator.wakeLock.request('screen')}catch(_){}}
mic.addEventListener('click',keepAwake);
</script>
</body>
</html>
