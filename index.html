<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Переводчик">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Синхронный переводчик</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#252b38;--txt:#f2f4f8;--dim:#8a93a6;--acc:#4f8cff;--rec:#ff4d5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
select{flex:1;min-width:0;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-size:16px}
button{font:inherit;color:var(--txt);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#swap{font-size:18px}
#log{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.item{margin-bottom:18px}
.src{color:var(--dim);font-size:16px;line-height:1.35}
.dst{font-size:24px;line-height:1.3;font-weight:600;margin-top:4px}
.live .src,.live .dst{opacity:.85}
.live .dst{color:#9fc0ff}
.hint{color:var(--dim);text-align:center;margin-top:30vh;padding:0 24px;line-height:1.5}
footer{display:flex;gap:10px;align-items:center;padding:10px 12px 14px;border-top:1px solid var(--line)}
#mic{flex:1;padding:16px;font-size:18px;font-weight:600;background:var(--acc);border:0;border-radius:14px}
#mic.on{background:var(--rec)}
#status{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);text-align:center;font-size:13px;line-height:1.35;padding:6px 12px;background:var(--bg);color:var(--rec);pointer-events:none}
</style>
</head>
<body>
<header>
  <select id="from"></select>
  <button id="swap" title="Поменять">⇄</button>
  <select id="to"></select>
  <button id="clear" title="Очистить">✕</button>
</header>
<div id="status"></div>
<div id="log"><div class="hint" id="hint">Выберите языки и нажмите «Начать». Перевод появляется прямо во время речи.</div></div>
<footer><button id="mic">🎤 Начать</button></footer>

<script>
const LANGS=[
 ['lv','Latviešu','lv-LV','latvian'],['ru','Русский','ru-RU','russian'],['en','English','en-US','english'],
 ['de','Deutsch','de-DE','german'],['lt','Lietuvių','lt-LT','lithuanian'],['et','Eesti','et-EE','estonian'],
 ['pl','Polski','pl-PL','polish'],['uk','Українська','uk-UA','ukrainian'],['fr','Français','fr-FR','french'],
 ['es','Español','es-ES','spanish'],['it','Italiano','it-IT','italian'],['tr','Türkçe','tr-TR','turkish']
];
// языки, которые iOS не отдаёт сайтам — для них своё распознавание (Whisper в телефоне)
const WHISPER_LANGS=['lv','lt','et'];
const $=id=>document.getElementById(id);
const from=$('from'),to=$('to'),log=$('log'),mic=$('mic'),status=$('status');
for(const s of [from,to]) for(const l of LANGS){const o=document.createElement('option');o.value=l[0];o.textContent=l[1];s.appendChild(o)}
from.value=localStorage.from||'lv'; to.value=localStorage.to||'ru';
const save=()=>{localStorage.from=from.value;localStorage.to=to.value};
from.onchange=()=>{save();forceW=false;restart()}; to.onchange=save;
$('swap').onclick=()=>{[from.value,to.value]=[to.value,from.value];save();forceW=false;restart()};
$('clear').onclick=()=>{log.innerHTML='';liveEl=null};

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const standalone=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
let rec=null,wanted=false,liveEl=null,timer=null,reqId=0,lastSent='',forceW=false;
const useWhisper=()=>forceW||WHISPER_LANGS.includes(from.value);

// ---- перевод: Google (без ключа), запасной — MyMemory
async function translate(text,sl,tl){
  try{
    const u='https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+sl+'&tl='+tl+'&q='+encodeURIComponent(text);
    const r=await fetch(u); if(!r.ok) throw 0;
    const j=await r.json(); return j[0].map(x=>x[0]).join('');
  }catch(e){
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+sl+'|'+tl);
    const j=await r.json(); return j.responseData.translatedText;
  }
}
function makeItem(live){
  $('hint')&&$('hint').remove();
  const d=document.createElement('div');d.className='item'+(live?' live':'');
  d.innerHTML='<div class="src"></div><div class="dst"></div>';
  log.appendChild(d);return d;
}
function scroll(){log.scrollTop=log.scrollHeight}
async function update(el,text){
  el.querySelector('.src').textContent=text;
  const my=++reqId; el._req=my;
  try{
    const t=await translate(text,from.value,to.value);
    if(el._req===my) el.querySelector('.dst').textContent=t;
  }catch(e){ el.querySelector('.dst').textContent='… нет связи'; }
  scroll();
}
function schedule(text,final){
  if(!liveEl) liveEl=makeItem(true);
  const el=liveEl;
  el.querySelector('.src').textContent=text; scroll();
  clearTimeout(timer);
  if(final){ el.classList.remove('live'); liveEl=null; update(el,text); return; }
  timer=setTimeout(()=>{ if(text!==lastSent){lastSent=text;update(el,text)} },350);
}

// ================= Whisper в телефоне (для латышского и др.) =================
let asr=null,asrLoading=null,wCtx=null,wStream=null,wProc=null,wSrc=null;
let wBuf=[],wLen=0,wPre=[],wSpeech=false,wSilence=0,wSent=0,wPending=0,wChain=Promise.resolve();
const RATE=16000, THR=0.012;

async function loadASR(){
  if(asr) return asr;
  if(asrLoading) return asrLoading;
  asrLoading=(async()=>{
    status.style.color='var(--dim)';
    status.textContent='Загрузка модели распознавания (один раз)…';
    const {pipeline,env}=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
    try{env.backends.onnx.wasm.numThreads=1}catch(_){}
    const cb=p=>{ if(p.status==='progress') status.textContent='Загрузка модели: '+Math.round(p.progress)+'%'; };
    // самая лёгкая модель, только wasm — чтобы Safari не убивал вкладку по памяти
    asr=await pipeline('automatic-speech-recognition','onnx-community/whisper-tiny',{device:'wasm',dtype:'q8',progress_callback:cb});
    status.textContent='';status.style.color='';
    return asr;
  })();
  try{return await asrLoading}catch(e){asrLoading=null;throw e}
}

async function startWhisper(){
  // микрофон и аудио — сразу, пока действует нажатие кнопки
  try{
    wCtx=new (window.AudioContext||window.webkitAudioContext)();
    wCtx.resume&&wCtx.resume();
    wStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){ status.textContent='Нет доступа к микрофону: значок aA → Настройки веб-сайта → Микрофон → Разрешить. ['+(e&&e.name||e)+']';wanted=false;ui();return }
  try{ await loadASR(); }
  catch(e){ status.style.color='';status.textContent='Не удалось загрузить модель: '+(e&&e.message||e);wanted=false;ui();stopWhisper();return }
  if(!wanted){stopWhisper();return}
  status.style.color='var(--dim)';status.textContent='Слушаю… (латышский, распознавание в телефоне)';
  try{await wCtx.resume()}catch(_){}
  wSrc=wCtx.createMediaStreamSource(wStream);
  wProc=wCtx.createScriptProcessor(4096,1,1);
  const ratio=wCtx.sampleRate/RATE;
  wBuf=[];wLen=0;wPre=[];wSpeech=false;wSilence=0;wSent=0;
  wProc.onaudioprocess=e=>{
    const inp=e.inputBuffer.getChannelData(0);
    const n=Math.floor(inp.length/ratio), out=new Float32Array(n);
    let sum=0;
    for(let i=0;i<n;i++){
      const a=Math.floor(i*ratio), b=Math.min(inp.length,Math.floor((i+1)*ratio));
      let v=0;for(let j=a;j<b;j++)v+=inp[j]; v/=Math.max(1,b-a); out[i]=v; sum+=v*v;
    }
    const rms=Math.sqrt(sum/n), dur=n/RATE;
    if(rms>THR){
      if(!wSpeech){wSpeech=true;for(const c of wPre){wBuf.push(c);wLen+=c.length}wPre=[]}
      wSilence=0;
    }else if(wSpeech){ wSilence+=dur; }
    if(wSpeech){ wBuf.push(out); wLen+=n; }
    else{ wPre.push(out); if(wPre.length>3) wPre.shift(); }
    if(wSpeech){
      if(wSilence>0.8||wLen>20*RATE){ flushWhisper(true); }
      else if(wLen-wSent>2.5*RATE){ flushWhisper(false); }
    }
  };
  wSrc.connect(wProc); wProc.connect(wCtx.destination);
}

function flushWhisper(final){
  if(!wLen) return;
  const audio=new Float32Array(wLen); let o=0; for(const c of wBuf){audio.set(c,o);o+=c.length}
  if(final){ wBuf=[];wLen=0;wSpeech=false;wSilence=0;wSent=0; }
  else{ if(wPending>0) return; wSent=wLen; }
  wPending++;
  const lang=LANGS.find(l=>l[0]===from.value)[3];
  wChain=wChain.then(async()=>{
    try{
      const r=await asr(audio,{language:lang,task:'transcribe'});
      const t=(r.text||'').trim();
      if(t) schedule(t,final);
      else if(final&&liveEl){liveEl.remove();liveEl=null}
    }catch(e){ status.textContent='Ошибка распознавания: '+(e&&e.message||e) }
    wPending--;
  });
}

function stopWhisper(){
  try{ if(wSpeech) flushWhisper(true) }catch(_){}
  try{wProc&&(wProc.onaudioprocess=null,wProc.disconnect())}catch(_){}
  try{wSrc&&wSrc.disconnect()}catch(_){}
  try{wStream&&wStream.getTracks().forEach(t=>t.stop())}catch(_){}
  try{wCtx&&wCtx.close()}catch(_){}
  wProc=wSrc=wStream=wCtx=null;
}

// ================= Распознавание iOS (русский, английский и др.) =================
function startIOS(){
  if(!SR){status.textContent='Распознавание речи не поддерживается. Откройте в Safari.';wanted=false;ui();return}
  rec=new SR();
  rec.lang=LANGS.find(l=>l[0]===from.value)[2];
  rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i], t=r[0].transcript.trim();
      if(t) schedule(t,r.isFinal);
    }
  };
  rec.onerror=e=>{
    if(e.error==='service-not-allowed'){
      // iOS не даёт этот язык сайтам — переключаемся на своё распознавание
      forceW=true; try{rec.onend=null}catch(_){}
      status.style.color='var(--dim)';status.textContent='iOS не поддерживает этот язык, включаю своё распознавание…';
      if(wanted) startWhisper();
    }else if(e.error==='not-allowed'){
      wanted=false;ui();
      status.textContent='Сайту запрещён микрофон: значок aA в адресной строке → Настройки веб-сайта → Микрофон → Разрешить, затем обновите страницу. [not-allowed]';
    }else if(e.error!=='no-speech'&&e.error!=='aborted'){status.textContent='Ошибка: '+e.error}
  };
  rec.onend=()=>{ if(wanted&&!forceW) setTimeout(()=>{try{startIOS()}catch(_){}},150); };
  try{rec.start();status.textContent=''}catch(e){}
}

function start(){ status.style.color=''; if(useWhisper()) startWhisper(); else startIOS(); }
function stopEngines(){
  try{ if(rec){rec.onend=null;rec.abort()} }catch(_){}
  rec=null; stopWhisper();
}
function stop(){wanted=false;stopEngines()}
function restart(){ if(wanted){stopEngines();start()} }
function ui(){mic.classList.toggle('on',wanted);mic.textContent=wanted?'⏹ Стоп':'🎤 Начать'}
mic.onclick=()=>{ if(wanted){stop()}else{wanted=true;start()} ui(); };

window.addEventListener('error',e=>{status.style.color='';status.textContent='Ошибка: '+e.message});
window.addEventListener('unhandledrejection',e=>{status.style.color='';status.textContent='Ошибка: '+(e.reason&&e.reason.message||e.reason)});
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let lock=null;
async function keepAwake(){try{if(wanted&&navigator.wakeLock)lock=await navigator.wakeLock.request('screen')}catch(_){}}
mic.addEventListener('click',keepAwake);
</script>
</body>
</html>
